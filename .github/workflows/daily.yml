
name: Iron Bot Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  daily-idea:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Create fitness idea
        run: |
          mkdir -p videos
          echo "Daily workout idea: 3 sets of push-ups, 3 sets of squats, and 3 sets of abdominal crunches." > videos/daily_idea.txt

      - name: Save idea
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/daily_idea.txt
          git diff --cached --quiet || git commit -m "Add daily fitness idea"
          git push
